services:
  collector-pointsbet:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./collectors/pointsbet_sandbox:/app
    command: ["bash", "-c", "pip install redis requests && python /app/pb_collector.py"]
    environment:
      - REDIS_URL=redis://broker:6379/0
      - CHANNEL=odds.raw.pointsbet
    depends_on: [broker]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  pointsbet-listener:
    image: python:3.11-slim
    command: |
      bash -c "pip install redis && python - <<'EOF'
      import redis
      import json
      import time

      r = redis.from_url('redis://broker:6379/0')
      p = r.pubsub()
      p.psubscribe('odds.raw.pointsbet')

      print('PointsBet listener started', flush=True)

      for msg in p.listen():
          if msg['type'] == 'pmessage':
              try:
                  data = json.loads(msg['data'])
                  events = data.get('events', [])
                  events_count = len(events)
                  odds_count = sum(len(e.get('odds', [])) for e in events)
                  print(f'[{time.strftime(\"%H:%M:%S\")}] PointsBet: {events_count} events, {odds_count} markets', flush=True)
              except:
                  pass
      EOF"
    depends_on: [broker]
    restart: unless-stopped

  pointsbet-normalizer:
    image: python:3.11-slim
    volumes:
      - ./collectors/pointsbet_sandbox:/app
    working_dir: /app
    command: ["bash", "-c", "pip install redis psycopg2-binary && python /app/pb_normalizer.py"]
    depends_on: [broker, store]
    restart: unless-stopped
