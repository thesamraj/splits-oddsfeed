# Render.com deployment configuration
# Stage enablement: Bovada → Kambi → FD → DK → MGM → Pinnacle
# Realness-gated, Neon-only, fail-soft normalizers

services:
  # Redis broker (required)
  - type: redis
    name: odds-broker
    plan: starter
    ipAllowList: []  # required by Render; empty list = internal-only access

  # API Server
  - type: web
    name: oddsfeed-api
    env: docker
    plan: starter
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: METRICS_PORT
        value: 9090
      - key: ENVIRONMENT
        value: production

  # Metrics Proxy (public endpoint)
  - type: web
    name: oddsfeed-metrics-proxy
    env: docker
    plan: starter
    dockerfilePath: ./services/metrics_proxy/Dockerfile
    dockerContext: ./services
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false  # For DB fallback metrics
      - key: METRICS_TARGETS
        value: "bovada-collector:9090,betrivers-collector:9090,barstool-collector:9090,caesars-collector:9090,sugarhouse-collector:9090,unibet-collector:9090,fanduel-collector:9090,draftkings-collector:9090,betmgm-collector:9090,pinnacle-collector:9090,bet365-collector:9090,stake-collector:9090,pointsbet-collector:9090,normalizer:9090"

  # Stage 0: Bovada (LIVE NOW)
  - type: worker
    name: oddsfeed-bovada
    env: docker
    plan: starter
    dockerfilePath: ./collectors/bovada_real/Dockerfile
    dockerContext: .
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: REAL_ONLY
        value: true
      - key: LIGHT_SOCCER
        value: true  # Limit soccer payload to 25MB
      - key: REALNESS_THRESHOLD
        value: 0.85  # Relaxed with hard signals
      - key: REALNESS_MIN_SAMPLES
        value: 200
      - key: REALNESS_MIN_WINDOW_MIN
        value: 10
      - key: REALNESS_QUARANTINE
        value: true
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091
      - key: COLLECTION_INTERVAL
        value: 60
      - key: SLACK_WEBHOOK
        sync: false  # Optional, set if needed

  # Stage 1: Kambi Unified (5 brands)
  # BetRivers
  - type: worker
    name: oddsfeed-betrivers
    env: docker
    plan: starter
    dockerfilePath: ./collectors/kambi_unified/Dockerfile
    dockerContext: ./collectors/kambi_unified
    numInstances: 1
    autoDeploy: false  # Enable after Bovada stable
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: KAMBI_BRAND
        value: betrivers
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091

  # Barstool
  - type: worker
    name: oddsfeed-barstool
    env: docker
    plan: starter
    dockerfilePath: ./collectors/kambi_unified/Dockerfile
    dockerContext: ./collectors/kambi_unified
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: KAMBI_BRAND
        value: barstool
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
