# Render.com minimal deployment configuration
# Services: Redis broker, Normalizer, Bovada collector, Metrics proxy

services:
  # Redis broker (required)
  - type: redis
    name: odds-broker
    plan: starter
    ipAllowList: []  # required by Render; empty list = internal-only access

  # Metrics Proxy (public endpoint)
  - type: web
    name: oddsfeed-metrics-proxy
    env: docker
    plan: starter
    dockerfilePath: ./services/metrics_proxy/Dockerfile
    dockerContext: ./services
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # For DB fallback metrics
      - key: METRICS_TARGETS
        value: "https://oddsfeed-bovada.onrender.com,https://oddsfeed-normalizer.onrender.com"
      - key: SERVICE_URL_BOVADA
        value: "https://oddsfeed-bovada.onrender.com"
      - key: SERVICE_URL_NORMALIZER
        value: "https://oddsfeed-normalizer.onrender.com"

  # Bovada collector (now a web service)
  - type: web
    name: oddsfeed-bovada
    env: docker
    plan: starter
    dockerfilePath: ./collectors/bovada_real/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: REDIS_URL
        value: redis://odds-broker:6379
      - key: LIGHT_SOCCER
        value: true  # Limit soccer payload to 25MB

  # Normalizer service (now a web service)
  - type: web
    name: oddsfeed-normalizer
    env: docker
    plan: starter
    dockerfilePath: ./normalizer/Dockerfile
    dockerContext: ./normalizer
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: REDIS_URL
        value: redis://odds-broker:6379