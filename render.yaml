    env: docker
    plan: starter
    dockerfilePath: ./collectors/kambi_unified/Dockerfile
    dockerContext: ./collectors/kambi_unified
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: KAMBI_BRAND
        value: caesars
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
