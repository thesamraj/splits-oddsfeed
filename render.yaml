        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: KAMBI_BRAND
        value: sugarhouse
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091

  # Unibet
  - type: worker
    name: oddsfeed-unibet
    env: docker
    plan: starter
    dockerfilePath: ./collectors/kambi_unified/Dockerfile
    dockerContext: ./collectors/kambi_unified
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: KAMBI_BRAND
        value: unibet
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091

  # Stage 2: WebSocket Heavyweights
  # FanDuel
  - type: worker
    name: oddsfeed-fanduel
    env: docker
    plan: starter
    dockerfilePath: ./collectors/fanduel_ws/Dockerfile
    dockerContext: ./collectors/fanduel_ws
    numInstances: 1
    autoDeploy: false  # Enable after Kambi stable
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091
      - key: PROXY_URL
        sync: false

  # DraftKings
  - type: worker
    name: oddsfeed-draftkings
    env: docker
    plan: starter
    dockerfilePath: ./collectors/draftkings_ws/Dockerfile
    dockerContext: ./collectors/draftkings_ws
    numInstances: 1
    autoDeploy: false  # Enable after FanDuel stable
    envVars:
