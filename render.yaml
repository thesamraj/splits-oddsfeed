      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091
      - key: PROXY_URL
        sync: false

  # Normalizer service (worker - no health check)
  - type: worker
    name: oddsfeed-normalizer
    env: docker
    plan: starter
    dockerfilePath: ./normalizer/Dockerfile
    dockerContext: ./normalizer
    numInstances: 1
    autoDeploy: true  # Normalizer always auto-deploys
    envVars:
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: ENABLE_REALNESS_GATE
        value: true
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091

  # Database cleaner cron job
  - type: cron
    name: oddsfeed-cleaner
    env: docker
    plan: starter
    schedule: "0 * * * *"  # Every hour
    dockerfilePath: ./services/db_cleaner/Dockerfile
    dockerContext: ./services/db_cleaner
    envVars:
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: RETENTION_HOURS
        value: 24

  # Redis broker
  - type: pserv
    name: oddsfeed-broker
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile.redis
    dockerContext: .
    autoDeploy: true
    disk:
      name: redis-data
      mountPath: /data
      sizeGB: 1
