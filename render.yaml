        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091
      - key: PROXY_URL
        sync: false

  # Stage 3: Remaining Books
  # BetMGM
  - type: worker
    name: oddsfeed-betmgm
    env: docker
    plan: starter
    dockerfilePath: ./collectors/betmgm_browser/Dockerfile
    dockerContext: ./collectors/betmgm_browser
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091
      - key: PROXY_URL
        sync: false

  # Pinnacle
  - type: worker
    name: oddsfeed-pinnacle
    env: docker
    plan: starter
    dockerfilePath: ./collectors/pinnacle/Dockerfile
    dockerContext: ./collectors/pinnacle
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: REAL_ONLY
        value: true
      - key: REALNESS_THRESHOLD
        value: 0.9
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091
      - key: PIN_USERNAME
        sync: false  # Set in dashboard
      - key: PIN_PASSWORD
        sync: false  # Set in dashboard

  # Bet365
  - type: worker
    name: oddsfeed-bet365
    env: docker
    plan: starter
    dockerfilePath: ./collectors/bet365_api/Dockerfile
    dockerContext: ./collectors/bet365_api
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: REAL_ONLY
