# Render.com minimal deployment configuration
# Services: Redis broker, Normalizer, Bovada collector, Metrics proxy

services:
  # Redis broker (required)
  - type: redis
    name: odds-broker
    plan: starter
    ipAllowList: []  # required by Render; empty list = internal-only access

  # Metrics Proxy (public endpoint)
  - type: web
    name: oddsfeed-metrics-proxy
    env: docker
    plan: starter
    dockerfilePath: ./services/metrics_proxy/Dockerfile
    dockerContext: ./services
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false  # For DB fallback metrics
      - key: METRICS_TARGETS
        value: "bovada-collector:9090,normalizer:9090"

  # Bovada collector
  - type: worker
    name: oddsfeed-bovada
    env: docker
    plan: starter
    dockerfilePath: ./collectors/bovada_real/Dockerfile
    dockerContext: .
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: REDIS_URL
        value: redis://odds-broker:6379
      - key: LIGHT_SOCCER
        value: true  # Limit soccer payload to 25MB
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091

  # Normalizer service  
  - type: worker
    name: oddsfeed-normalizer
    env: docker
    plan: starter
    dockerfilePath: ./normalizer/Dockerfile
    dockerContext: ./normalizer
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: REDIS_URL
        value: redis://oddsfeed-broker:6379
      - key: METRICS_PORT
        value: 9090
      - key: HEALTH_PORT
        value: 9091