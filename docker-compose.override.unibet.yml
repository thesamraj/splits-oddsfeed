services:
  collector-unibet:
    image: ghcr.io/thesamraj/splits-oddsfeed/collector-kambi-browser:latest
    environment:
      - BOOK=unibet
      - BRAND=unibet
      - TOKEN=us3pa
      - BASE_URL=https://eu.offering-api.kambicdn.com/offering/v2018
      - REDIS_URL=redis://broker:6379/0
      - CHANNEL=odds.raw.unibet
      - INTERVAL=20
    depends_on: [broker]
    restart: unless-stopped
    ports:
      - "9125:9118"  # Use different port to avoid conflict

  unibet-normalizer:
    build:
      context: ./normalizer
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://broker:6379/0
      - DATABASE_URL=postgresql://odds:odds@store:5432/oddsfeed
      - SUBSCRIBE_CHANNELS=odds.raw.unibet
      - BOOK_OVERRIDE=unibet
    depends_on: [broker, store]
    restart: unless-stopped
