      KAMBI_STORAGE: ${KAMBI_STORAGE_SUGARHOUSE:-/app/state/kambi-browser/state.json}
      KAMBI_BROWSER_HEADFUL: ${KAMBI_BROWSER_HEADFUL:-false}
      KAMBI_LAST_RESORT_AFTER_SEC: ${KAMBI_LAST_RESORT_AFTER_SEC:-15}
      KAMBI_NAV_TIMEOUT_SEC: ${KAMBI_NAV_TIMEOUT_SEC:-25}
      PROXY_URL: ${PROXY_URL:-}
      PROXY_MANAGER_URL: ${PROXY_MANAGER_URL:-}
      METRICS_PORT: 9118
      KAMBI_ROTATE_URLS: https://pa.sugarhouse.com/?page=sportsbook#american_football/nfl,https://pa.sugarhouse.com/?page=sportsbook#baseball/mlb,https://pa.sugarhouse.com/?page=sportsbook#basketball/nba,https://pa.sugarhouse.com/?page=sportsbook#ice_hockey/nhl,https://pa.sugarhouse.com/?page=sportsbook#american_football/ncaaf,https://pa.sugarhouse.com/?page=sportsbook#basketball/ncaab,https://pa.sugarhouse.com/?page=sportsbook#tennis
      KAMBI_ROTATE_DWELL_SEC: 6
      KAMBI_AUTOSCROLL: 1
      KAMBI_AUTOSCROLL_PASSES: 8
      KAMBI_CLICK_MORE: 1
    volumes:
      - ./state/kambi-browser-2:/app/state/kambi-browser
      - ./artifacts/kambi-browser-2:/app/artifacts
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "9120:9118"
    restart: unless-stopped

