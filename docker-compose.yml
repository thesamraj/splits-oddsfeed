      - ./artifacts/kambi-browser-betrivers-3:/app/artifacts
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "9126:9118"
    restart: unless-stopped

  # Additional SugarHouse collector for scaling
  # Single polite SugarHouse collector with /healthz endpoint
  sugarhouse-1:
    build: ./collector-kambi-browser
    environment:
      REDIS_URL: ${REDIS_URL:-redis://broker:6379/0}
      REDIS_CHANNEL: ${REDIS_CHANNEL_KAMBI:-odds.raw.kambi}
      COLLECTOR_MODE: sugarhouse
      MIN_INTERVAL_SEC: 30
      MAX_BACKOFF_SEC: 300
      REQUEST_TIMEOUT: 10
      METRICS_PORT: 9132
      HEALTHZ_PORT: 9133
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "9133:9133"  # Health endpoint
      - "9132:9132"  # Metrics endpoint
    restart: unless-stopped

  collector-pinnacle:
    image: ${COLLECTOR_PIN_IMAGE:-ghcr.io/${REPO_OWNER:-thesamraj}/${REPO_NAME:-splits-oddsfeed}/collector-pinnacle:latest}
    build: ./collector-pinnacle
    environment:
      REDIS_URL: ${REDIS_URL:-redis://broker:6379/0}
      PIN_BASE_URL: ${PIN_BASE_URL:-https://api.pinnacle.com}
      PIN_USERNAME: ${PIN_USERNAME:-}
      PIN_PASSWORD: ${PIN_PASSWORD:-}
      PIN_SPORT_ID: ${PIN_SPORT_ID:-29}
      PIN_LEAGUE_IDS: ${PIN_LEAGUE_IDS:-}
      PIN_MARKETS: ${PIN_MARKETS:-moneyline,spreads,totals}
      PIN_INTERVAL: ${PIN_INTERVAL:-5}
      PIN_USE_MOCK: ${PIN_USE_MOCK:-true}
      PIN_TIMEOUT_CONNECT: ${PIN_TIMEOUT_CONNECT:-4}
      PIN_TIMEOUT_READ: ${PIN_TIMEOUT_READ:-6}
      PIN_ETAG_CACHE: ${PIN_ETAG_CACHE:-true}
      PIN_DAILY_REQUEST_BUDGET: ${PIN_DAILY_REQUEST_BUDGET:-10000}
      PIN_BUDGET_MIN_REMAINING: ${PIN_BUDGET_MIN_REMAINING:-100}
      PIN_RATE_LIMIT_SLEEP_MS: ${PIN_RATE_LIMIT_SLEEP_MS:-250}
      PIN_PROM_PORT: ${PIN_PROM_PORT:-9110}
    ports:
      - "9110:9110"
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  redis-data:
  prometheus-data:
  grafana-data:
networks:
  default:
    driver: bridge
