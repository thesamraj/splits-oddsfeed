      PROXY_URL: ${PROXY_URL:-}
      PROXY_MANAGER_URL: ${PROXY_MANAGER_URL:-}
      METRICS_PORT: 9118
      KAMBI_ROTATE_URLS: https://pa.betparx.com/?page=sportsbook#american_football/nfl,https://pa.betparx.com/?page=sportsbook#baseball/mlb,https://pa.betparx.com/?page=sportsbook#basketball/nba,https://pa.betparx.com/?page=sportsbook#ice_hockey/nhl
      KAMBI_ROTATE_DWELL_SEC: 8

  collector-kambi-browser-unibet:
    image: ${COLLECTOR_KAMBI_BROWSER_IMAGE:-ghcr.io/thesamraj/splits-oddsfeed/collector-kambi-browser:latest}
    environment:
      REDIS_URL: ${REDIS_URL:-redis://broker:6379/0}
      REDIS_CHANNEL: ${REDIS_CHANNEL_KAMBI:-odds.raw.kambi}
      KAMBI_STATE_URL: ${KAMBI_STATE_URL_UNIBET:-https://pa.unibet.com/?page=sportsbook#american_football/nfl}
      KAMBI_CAPTURE_PATTERNS: ${KAMBI_CAPTURE_PATTERNS:-/offering/.*(v2018|events|selections)|e0-api.kambi.com/.*}
      KAMBI_STORAGE: ${KAMBI_STORAGE_UNIBET:-/app/state/kambi-browser/unibet-state.json}
      KAMBI_BROWSER_HEADFUL: ${KAMBI_BROWSER_HEADFUL:-false}
