      KAMBI_CLICK_MORE: 1
    volumes:
      - ./state/kambi-browser-parx:/app/state/kambi-browser
      - ./artifacts/kambi-browser-parx:/app/artifacts
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "9124:9118"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    shm_size: "1g"
    restart: unless-stopped

  # Additional BetRivers collector for scaling
  collector-kambi-browser-betrivers-2:
    image: ${COLLECTOR_KAMBI_BROWSER_IMAGE:-ghcr.io/thesamraj/splits-oddsfeed/collector-kambi-browser:latest}
    environment:
      REDIS_URL: ${REDIS_URL:-redis://broker:6379/0}
      REDIS_CHANNEL: ${REDIS_CHANNEL_KAMBI:-odds.raw.kambi}
      KAMBI_STATE_URL: https://pa.betrivers.com/?page=sportsbook#basketball/nba
