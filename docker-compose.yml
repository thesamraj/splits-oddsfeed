      METRICS_PORT: 9118
      KAMBI_ROTATE_URLS: https://pa.betrivers.com/?page=sportsbook#baseball/mlb,https://pa.betrivers.com/?page=sportsbook#basketball/ncaab,https://pa.betrivers.com/?page=sportsbook#american_football/nfl
      KAMBI_ROTATE_DWELL_SEC: 7
