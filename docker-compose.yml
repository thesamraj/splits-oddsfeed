      KAMBI_NAV_TIMEOUT_SEC: ${KAMBI_NAV_TIMEOUT_SEC:-25}
      PROXY_URL: ${PROXY_URL:-}
      PROXY_MANAGER_URL: ${PROXY_MANAGER_URL:-}
      METRICS_PORT: 9118
      KAMBI_ROTATE_URLS: https://pa.unibet.com/?page=sportsbook#american_football/nfl,https://pa.unibet.com/?page=sportsbook#baseball/mlb,https://pa.unibet.com/?page=sportsbook#basketball/nba,https://pa.unibet.com/?page=sportsbook#ice_hockey/nhl
      KAMBI_ROTATE_DWELL_SEC: 8
      KAMBI_AUTOSCROLL: 1
