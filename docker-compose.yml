      KAMBI_BROWSER_HEADFUL: ${KAMBI_BROWSER_HEADFUL:-false}
      KAMBI_LAST_RESORT_AFTER_SEC: ${KAMBI_LAST_RESORT_AFTER_SEC:-15}
      KAMBI_NAV_TIMEOUT_SEC: ${KAMBI_NAV_TIMEOUT_SEC:-25}
      PROXY_URL: ${PROXY_URL:-}
