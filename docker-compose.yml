      METRICS_PORT: 9118
      KAMBI_ROTATE_URLS: https://pa.betrivers.com/?page=sportsbook#basketball/nba,https://pa.betrivers.com/?page=sportsbook#ice_hockey/nhl,https://pa.betrivers.com/?page=sportsbook#tennis,https://pa.betrivers.com/?page=sportsbook#american_football/ncaaf
      KAMBI_ROTATE_DWELL_SEC: 6
      KAMBI_AUTOSCROLL: 1
      KAMBI_AUTOSCROLL_PASSES: 10
      KAMBI_CLICK_MORE: 1
    volumes:
      - ./state/kambi-browser-betrivers-2:/app/state/kambi-browser
      - ./artifacts/kambi-browser-betrivers-2:/app/artifacts
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "9124:9118"
    restart: unless-stopped

  # Additional BetRivers collector focusing on different sports
  collector-kambi-browser-betrivers-3:
    image: ${COLLECTOR_KAMBI_BROWSER_IMAGE:-ghcr.io/thesamraj/splits-oddsfeed/collector-kambi-browser:latest}
    environment:
      REDIS_URL: ${REDIS_URL:-redis://broker:6379/0}
      REDIS_CHANNEL: ${REDIS_CHANNEL_KAMBI:-odds.raw.kambi}
      KAMBI_STATE_URL: https://pa.betrivers.com/?page=sportsbook#baseball/mlb
      KAMBI_CAPTURE_PATTERNS: ${KAMBI_CAPTURE_PATTERNS:-/offering/.*(v2018|events|selections)|e0-api.kambi.com/.*}
