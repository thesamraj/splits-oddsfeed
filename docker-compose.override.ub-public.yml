services:
  collector-ub-dom-final:
    build: ./collectors/ub_dom_final
    environment:
      UB_URL: "https://pa.unibet.com/?page=sportsbook#live"
      REDIS_URL: "redis://broker:6379/0"
      DURATION_SEC: "480"
    depends_on: [ broker ]
    shm_size: "1g"
    restart: unless-stopped

  ub-dom-shim-final:
    build: ./shims/ub_dom_shim_final
    environment:
      REDIS_URL: "redis://broker:6379/0"
      SUB: "odds.raw.unibet_dom"
    depends_on: [ broker ]
    restart: unless-stopped
