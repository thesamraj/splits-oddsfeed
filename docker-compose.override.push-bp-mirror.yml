version: '3.8'
services:
  collector-kambi-push-betparx-mirror:
    build:
      context: ./pushers/betparx
      dockerfile: Dockerfile.mirror
    environment:
      - BRAND=betparx
      - HOME_URL=https://pa.betparx.com/?page=sportsbook#live
      - REDIS_URL=redis://broker:6379/0
    depends_on:
      - broker
    ports:
      - "9127:9118"
    restart: unless-stopped
    platform: linux/amd64
