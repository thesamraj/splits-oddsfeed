version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: oddsfeed-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - oddsfeed_network

  prometheus:
    image: prom/prometheus:latest
    container_name: oddsfeed-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - oddsfeed_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: oddsfeed-pg-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://odds:odds@store:5432/oddsfeed?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - oddsfeed_network

networks:
  oddsfeed_network:
    external: true

volumes:
  grafana-storage:
  prometheus-storage:
