<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OddsOps — BR/SH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:20px}
    header{display:flex;gap:12px;align-items:center;margin-bottom:16px}
    input,button,select{padding:8px 10px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    pre{background:#f6f8fa;padding:12px;border-radius:8px;overflow:auto;max-height:420px}
    .card{border:1px solid #eee;border-radius:8px;padding:12px}
    .kpi{display:flex;gap:24px}
    .kpi div{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:10px 12px}
  </style>
</head>
<body>
  <header>
    <strong>OddsOps — BetRivers / SugarHouse</strong>
    <select id="brand">
      <option value="betrivers">BetRivers</option>
      <option value="sugarhouse">SugarHouse</option>
      <option value="bovada">Bovada</option>
    </select>
    <input id="minutes" type="number" min="1" value="15" />
    <button id="btnLatest">Latest</button>
    <input id="eventId" placeholder="event_id for history" style="flex:1" />
    <button id="btn60">History 60m</button>
    <button id="btn7d">History 7d</button>
  </header>

  <div class="kpi">
    <div><b>odds_15m</b> <span id="k_odds">-</span></div>
    <div><b>ticks_15m</b> <span id="k_ticks">-</span></div>
    <div><b>events_15m</b> <span id="k_events">-</span></div>
    <div><b>api_ok</b> <span id="k_api">-</span></div>
    <div><b>ts</b> <span id="k_ts">-</span></div>
  </div>

  <div class="grid" style="margin-top:16px">
    <div class="card">
      <b>/odds (sample)</b>
      <pre id="latest"></pre>
      <a id="dlLatest" href="#" download="latest.json">Download JSON</a>
    </div>
    <div class="card">
      <b>/odds/history (sample)</b>
      <pre id="history"></pre>
      <a id="dlHistory" href="#" download="history.json">Download JSON</a>
    </div>
    <div class="card">
      <b>Status</b>
      <pre id="status"></pre>
      <a id="dlStatus" href="/status.json" download="status.json">Download status.json</a>
    </div>
    <div class="card">
      <b>CSV Export (latest)</b>
      <div><button id="btnCsv">Download CSV</button></div>
    </div>
  </div>

<script>
const API="http://127.0.0.1:8080";
async function fetchJSON(u){ const r=await fetch(u); return r.json(); }
function dl(id, data, name){ const blob=new Blob([data],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.getElementById(id); a.href=url; a.download=name; }
async function refreshStatus(){
  try{
    const r=await fetch('/status.json'); const j=await r.json();
    document.getElementById('k_odds').textContent=j.odds_15m;
    document.getElementById('k_ticks').textContent=j.ticks_15m;
    document.getElementById('k_events').textContent=j.events_15m;
    document.getElementById('k_api').textContent=j.api_ok;
    document.getElementById('k_ts').textContent=j.ts;
    document.getElementById('status').textContent=JSON.stringify(j,null,2);
  }catch(e){ document.getElementById('status').textContent=String(e); }
}
async function loadLatest(){
  const brand=document.getElementById('brand').value;
  const minutes=document.getElementById('minutes').value;
  const url=\`\${API}/odds?brand=\${brand}&minutes=\${minutes}&limit=3\`;
  const j=await fetchJSON(url);
  document.getElementById('latest').textContent=JSON.stringify(j,null,2);
  dl('dlLatest', JSON.stringify(j,null,2), 'latest.json');
}
async function loadHistory(mins){
  const brand=document.getElementById('brand').value;
  const eventId=document.getElementById('eventId').value.trim();
  if(!eventId){ alert('enter event_id'); return; }
  const url=\`\${API}/odds/history?brand=\${brand}&event_id=\${eventId}&minutes=\${mins}\`;
  const j=await fetchJSON(url);
  document.getElementById('history').textContent=JSON.stringify(j,null,2);
  dl('dlHistory', JSON.stringify(j,null,2), 'history.json');
}
function toCSV(rows){
  if(!rows || !rows.length) return "";
  const cols=Object.keys(rows[0]);
  const head=cols.join(',');
  const body=rows.map(r=>cols.map(c=>JSON.stringify(r[c]??"")).join(',')).join('\n');
  return head+'\n'+body+'\n';
}
document.getElementById('btnLatest').onclick=loadLatest;
document.getElementById('btn60').onclick=()=>loadHistory(60);
document.getElementById('btn7d').onclick=()=>loadHistory(10080);
document.getElementById('btnCsv').onclick=async ()=>{
  const brand=document.getElementById('brand').value;
  const minutes=document.getElementById('minutes').value;
  const url=\`\${API}/odds?brand=\${brand}&minutes=\${minutes}&limit=50\`;
  const j=await fetchJSON(url);
  const rows=(j && j.events)||[];
  const csv=toCSV(rows);
  const blob=new Blob([csv],{type:"text/csv"}); const url2=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url2; a.download='latest.csv'; a.click();
};
refreshStatus(); setInterval(refreshStatus, 60000);
</script>
</body>
</html>
