name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker images
      run: |
        # Build and push API
        docker build -t ghcr.io/${{ github.repository }}/api:latest ./api
        docker push ghcr.io/${{ github.repository }}/api:latest

        # Build and push Bovada collector
        docker build -t ghcr.io/${{ github.repository }}/bovada:latest -f ./collectors/bovada_real/Dockerfile .
        docker push ghcr.io/${{ github.repository }}/bovada:latest

        # Build and push metrics server
        docker build -t ghcr.io/${{ github.repository }}/metrics:latest ./services/metrics_server
        docker push ghcr.io/${{ github.repository }}/metrics:latest

    - name: Deploy to Render
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      run: |
        curl -X POST \
          -H "Authorization: Bearer $RENDER_API_KEY" \
          -H "Content-Type: application/json" \
          https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
