name: Deny Fake Generators

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-for-fakes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Check for fake/test services in production paths
      run: |
        chmod +x scripts/deny_generators.sh
        # Run in dry-run mode, checking only production paths
        # Explicitly excludes archive/** and docs/**
        ./scripts/deny_generators.sh --dry-run
