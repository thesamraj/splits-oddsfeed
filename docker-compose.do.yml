version: '3.8'

services:
  # Bolt normalizer (staging only)
  bolt-normalizer:
    build:
      context: .
      dockerfile: ./services/bolt_normalizer/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BOLT_CHANNEL=odds.raw.bolt.staging
      - PORT=8000
    ports:
      - "19098:8000"
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # Bovada collector
  bovada:
    build:
      context: .
      dockerfile: ./collectors/bovada_real/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REAL_ONLY=true
      - REALNESS_THRESHOLD=0.85
      - LIGHT_SOCCER=true
      - PORT=8000
    ports:
      - "19081:8000"
    networks:
      - odds-network
    restart: unless-stopped

  # Non-Kambi Real Collectors
  circa:
    build:
      context: .
      dockerfile: ./collectors/circa/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19084:8000"
    networks:
      - odds-network
    restart: unless-stopped

  superbook:
    build:
      context: .
      dockerfile: ./collectors/superbook/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19085:8000"
    networks:
      - odds-network
    restart: unless-stopped

  betonline:
    build:
      context: .
      dockerfile: ./collectors/betonline/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19086:8000"
    networks:
      - odds-network
    restart: unless-stopped

  bookmaker:
    build:
      context: .
      dockerfile: ./collectors/bookmaker/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19087:8000"
    networks:
      - odds-network
    restart: unless-stopped

  betway:
    build:
      context: .
      dockerfile: ./collectors/betway/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19089:8000"
    networks:
      - odds-network
    restart: unless-stopped

  wynnbet:
    build:
      context: .
      dockerfile: ./collectors/wynnbet/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19090:8000"
    networks:
      - odds-network
    restart: unless-stopped

  # Normalizer
  normalizer:
    build:
      context: ./normalizer
      dockerfile: ./Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19082:8000"
    networks:
      - odds-network
    restart: unless-stopped

  # Kambi Browser collector (Playwright-based, handles all 5 brands)
  kambi-browser:
    build:
      context: ./collectors/kambi_browser
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - KAMBI_BRANDS=betrivers,barstool,caesars,sugarhouse,unibet
      - PROXY_HOST=${PROXY_HOST}
      - PROXY_PORT=${PROXY_PORT}
      - PROXY_USER=${PROXY_USER}
      - PROXY_PASS=${PROXY_PASS}
      - HTTP_PROXY=http://${PROXY_USER}:${PROXY_PASS}@${PROXY_HOST}:${PROXY_PORT}
      - HTTPS_PROXY=http://${PROXY_USER}:${PROXY_PASS}@${PROXY_HOST}:${PROXY_PORT}
      - ALL_PROXY=http://${PROXY_USER}:${PROXY_PASS}@${PROXY_HOST}:${PROXY_PORT}
      - NO_PROXY=localhost,127.0.0.1,redis,postgres,metrics-proxy,normalizer,bovada
      - PORT=8000
      - POLL_INTERVAL_SEC=30
    ports:
      - "19088:8000"
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # Pinnacle Site Scraper
  pinnacle-site:
    build:
      context: ./collectors/pinnacle_site
      dockerfile: ./Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
      - PINNACLE_SPORTS=NFL,NBA,NHL,MLB
      - SCRAPE_INTERVAL_SEC=60
      - PLAYWRIGHT_HEADFUL=false
      - DEBUG_NETWORK=1
      - USE_PROXY=${USE_PROXY:-false}
      - PROXY_PROVIDER=${PROXY_PROVIDER:-soax}
      - SOAX_HOST=${SOAX_HOST}
      - SOAX_PORT=${SOAX_PORT}
      - SOAX_USER=${SOAX_USER}
      - SOAX_PASS=${SOAX_PASS}
      - BRIGHT_HOST=${BRIGHT_HOST}
      - BRIGHT_PORT=${BRIGHT_PORT}
      - BRIGHT_USER=${BRIGHT_USER}
      - BRIGHT_PASS=${BRIGHT_PASS}
    ports:
      - "19095:8000"
    volumes:
      - ./data/pinnacle_site:/app/data/pinnacle_site
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # PointsBet Unified Collector
  pointsbet-unified:
    build:
      context: ./collectors/pointsbet_unified
      dockerfile: ./Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
      - POINTSBET_SPORTS=NFL,NBA,NHL,MLB
      - SCRAPE_INTERVAL_SEC=60
      - USE_PLAYWRIGHT=auto
      - DEBUG_NETWORK=1
      - USE_PROXY=${USE_PROXY:-false}
      - PROXY_PROVIDER=${PROXY_PROVIDER:-soax}
      - SOAX_HOST=${SOAX_HOST}
      - SOAX_PORT=${SOAX_PORT}
      - SOAX_USER=${SOAX_USER}
      - SOAX_PASS=${SOAX_PASS}
      - BRIGHT_HOST=${BRIGHT_HOST}
      - BRIGHT_PORT=${BRIGHT_PORT}
      - BRIGHT_USER=${BRIGHT_USER}
      - BRIGHT_PASS=${BRIGHT_PASS}
    ports:
      - "19096:8000"
    volumes:
      - ./data/pointsbet_unified:/app/data/pointsbet_unified
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # HardRock collector (STOPPED - not capturing)
  # hardrock:
  #   build:
  #     context: ./collectors/hardrock
  #     dockerfile: ./Dockerfile
  #   environment:
  #     - REDIS_URL=${REDIS_URL}
  #     - USE_PROXY=${USE_PROXY:-false}
  #     - SOAX_HOST=${SOAX_HOST}
  #     - SOAX_PORT=${SOAX_PORT}
  #     - SOAX_USER=${SOAX_USER}
  #     - SOAX_PASS=${SOAX_PASS}
  #     - PORT=8000
  #   ports:
  #     - "19101:8000"
  #   networks:
  #     - odds-network
  #   depends_on:
  #     - normalizer
  #   restart: unless-stopped

  # BetUS collector
  betus:
    build:
      context: ./collectors/betus
      dockerfile: ./Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - USE_PROXY=${USE_PROXY:-false}
      - SOAX_HOST=${SOAX_HOST}
      - SOAX_PORT=${SOAX_PORT}
      - SOAX_USER=${SOAX_USER}
      - SOAX_PASS=${SOAX_PASS}
      - PORT=8000
    ports:
      - "19105:8000"
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # MyBookie collector
  mybookie:
    build:
      context: ./collectors/mybookie
      dockerfile: ./Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - USE_PROXY=${USE_PROXY:-false}
      - SOAX_HOST=${SOAX_HOST}
      - SOAX_PORT=${SOAX_PORT}
      - SOAX_USER=${SOAX_USER}
      - SOAX_PASS=${SOAX_PASS}
      - PORT=8000
    ports:
      - "19106:8000"
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # BetFred collector
  betfred:
    build:
      context: ./collectors/betfred
      dockerfile: ./Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - USE_PROXY=${USE_PROXY:-false}
      - SOAX_HOST=${SOAX_HOST}
      - SOAX_PORT=${SOAX_PORT}
      - SOAX_USER=${SOAX_USER}
      - SOAX_PASS=${SOAX_PASS}
      - PORT=8000
    ports:
      - "19105:8000"
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # BetNow collector
  betnow:
    build:
      context: ./collectors/betnow
      dockerfile: ./Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19112:8000"
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # Everygame collector
  everygame:
    build:
      context: ./collectors/everygame
      dockerfile: ./Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19113:8000"
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # Heritage collector
  heritage:
    build:
      context: ./collectors/heritage
      dockerfile: ./Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - PORT=8000
    ports:
      - "19114:8000"
    networks:
      - odds-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # Metrics Proxy
  metrics-proxy:
    build:
      context: ./services
      dockerfile: ./metrics_proxy/Dockerfile
    environment:
      - METRICS_TARGETS=http://bovada:8000,http://kambi-browser:8000,http://normalizer:8000,http://pinnacle-site:8000,http://pointsbet-unified:8000,http://betnow:8000,http://everygame:8000,http://heritage:8000
      - DATABASE_URL=${DATABASE_URL}
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - odds-network
    depends_on:
      - bovada
      - normalizer
      - kambi-browser
      - pinnacle-site
      - pointsbet-unified
      - betnow
      - everygame
      - heritage
    restart: unless-stopped

networks:
  odds-network:
    driver: bridge